name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,postgres-meta

      - name: Database tests
        run: supabase test db

      # The integration tests in test/ talk to the local Supabase started above.
      - name: Flutter tests
        run: flutter test --dart-define-from-file=env/local.json
